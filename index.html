<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {

                    colors: {
                        brandRed: '#b91c1c',
                        brandDark: '#111827',
                        brandYellow: '#eab308',
                        paperBg: '#fbf8f2',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

        }
